# ── Prefix: Ctrl+a (más cómodo que Ctrl+b) ───────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on

# ── Split panels ─────────────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Navegar paneles con Alt+flechas (sin prefix) ────────────────────────────
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ── Navegar paneles vim style ────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Redimensionar paneles ────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Nueva ventana en directorio actual ───────────────────────────────────────
bind c new-window -c "#{pane_current_path}"

# ── Reload config ────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config recargada"

# ── Copiar con vi keys ──────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"

# ── Colores (gris/blanco, sin morado) ───────────────────────────────────────
set -g status-style "bg=#1a1a1a,fg=#808080"
set -g status-left "#[fg=#d4d4d4,bold] #S "
set -g status-right "#[fg=#808080]%H:%M "
set -g status-left-length 20
set -g status-right-length 20

setw -g window-status-format "#[fg=#5a5a5a] #I:#W "
setw -g window-status-current-format "#[fg=#d4d4d4,bold] #I:#W "

set -g pane-border-style "fg=#2d2d2d"
set -g pane-active-border-style "fg=#d4d4d4"
set -g message-style "bg=#1a1a1a,fg=#d4d4d4"
