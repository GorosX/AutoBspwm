[colors]
background = #1a1a1a
background-alt = #2d2d2d
foreground = #d4d4d4
alert = #f44747
green = #6a9955
yellow = #d7ba7d
cyan = #4ec9b0
dimmed = #808080

[bar/oscp]
width = 100%
height = 24pt
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
padding-left = 1
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.background-alt}
font-0 = HackNerdFont:size=10;3
font-1 = HackNerdFont:size=14;4
modules-left = bspwm
modules-center = date
modules-right = exam_timer target vpn_status eth0 cpu memory
cursor-click = pointer
enable-ipc = true
wm-restack = bspwm

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-background = ${colors.foreground}
label-focused-foreground = ${colors.background}
label-focused-padding = 2
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.dimmed}
label-empty-padding = 2

[module/target]
type = custom/script
exec = ~/.config/polybar/scripts/target_display.sh
interval = 3
format-prefix = "TGT: "
format-prefix-foreground = ${colors.dimmed}

[module/vpn_status]
type = custom/script
exec = ~/.config/polybar/scripts/ethernet_status.sh
interval = 5
format-foreground = ${colors.green}

[module/eth0]
type = custom/script
exec = ip -4 addr show eth0 2>/dev/null | grep -oP '(?<=inet\s)\d+(\.\d+){3}' || echo ""
interval = 10
format-prefix = "ETH "
format-prefix-foreground = ${colors.cyan}
format-foreground = ${colors.cyan}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.dimmed}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.dimmed}
label = %percentage_used:2%%

[module/date]
type = internal/date
interval = 1
date = %d/%m/%Y
time = %H:%M:%S
label = %date%  %time%

[module/exam_timer]
type = custom/script
exec = ~/.config/polybar/scripts/exam_timer.sh
interval = 1
format-prefix = "EXAM "
format-prefix-foreground = ${colors.dimmed}
click-left = ~/.config/polybar/scripts/exam_timer.sh toggle

[settings]
screenchange-reload = true
pseudo-transparency = false
